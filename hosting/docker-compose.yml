# WP hosting stack behind a cloudflared tunnel (template).
# html/ = the whole WP (core + wp-content); provide your own wp-config.php
# (see wp-config-snippet.php). Passwords are PLACEHOLDERS — fill from a secret store.
services:
  wp-db:
    image: mariadb:11
    container_name: SITE-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: SITE_wp
      MARIADB_USER: SITE
      MARIADB_PASSWORD: __DB_PASSWORD__
      MARIADB_ROOT_PASSWORD: __DB_ROOT_PASSWORD__
    volumes:
      - SITE_db:/var/lib/mysql

  wp:
    image: wordpress:php8.3-apache
    container_name: SITE-wp
    restart: unless-stopped
    depends_on: [wp-db]
    # bind to localhost only — public access comes solely through cloudflared
    ports: ["127.0.0.1:__PORT__:80"]
    volumes:
      - ./html:/var/www/html
      - ./apache-override.conf:/etc/apache2/conf-enabled/zzz-override.conf

volumes:
  SITE_db:

# After bringing it up, import the DB:
#   docker exec -i SITE-db mariadb -u root -p__DB_ROOT_PASSWORD__ SITE_wp < init.sql
# Install a language AS THE FILE OWNER (uid), not www-data (otherwise permission fail):
#   docker run --rm --network container:SITE-wp -v $PWD/html:/var/www/html -u 1000:1000 \
#     wordpress:cli language core install xx_XX
#   ... language theme install --all xx_XX ; language plugin install --all xx_XX
